# M1 Baseline — SimpleFlight recipe on MuJoCo MJX
# Frozen before training. Do not edit mid-run.
# Sources: SimpleFlight (Chen et al., RAL 2025) Table VI + M1 spec v2.

experiment:
  name: m1_baseline
  seed: 42
  total_epochs: 15000
  eval_every: 500
  checkpoint_every: 1000
  log_every: 10

env:
  num_envs: 1024           # start here; reduce to 512 if OOM on 4070
  sim_freq: 100            # Hz
  episode_len: 1000        # steps (10 seconds)

  # Domain randomization — M1: ONLY thrust coefficient
  dr:
    thrust_coeff_range: [0.7, 1.3]   # k_f ± 30%
    # mass, inertia: NOT randomized (use SysID Crazyflie 2.1 values exactly)

  # Crazyflie 2.1 physical parameters (from SimpleFlight paper)
  quadrotor:
    mass: 0.0321           # kg
    ixx: 1.4e-5            # kg·m²
    iyy: 1.4e-5
    izz: 2.17e-5
    kf: 2.350347298350041e-08   # thrust coefficient [N/(rad/s)²]
    km: 7.24e-10                # moment coefficient [N·m/(rad/s)²]
    arm_length: 0.046           # center-to-rotor [m]
    max_rotor_speed: 2315       # [rad/s]
    motor_tau: 0.025            # motor time constant [s]

  # Termination
  min_height: 0.05         # m — ground crash
  max_bbox_dist: 5.0       # m — bounding box from reference
  max_tilt_deg: 60         # degrees — pitch/roll limit

observation:
  # Actor:  [e^W (30), v (3), R (9), ω (3)] = 45-dim
  # Critic: [actor_obs (45), k (1)] = 46-dim
  lookahead_points: 10     # next N reference trajectory points
  lookahead_dt_ms: 50      # 50 ms between points = 5 steps at 100 Hz
  use_rotation_matrix: true
  use_prev_action: false   # NEVER include — causes non-stationarity
  actor_dim: 45
  critic_dim: 46

action:
  space: ctbr              # collective thrust + body rates
  dim: 4                   # [ω_x^d, ω_y^d, ω_z^d, c]
  # Ranges (applied in ctbr_controller.py):
  #   body rates: ±π rad/s per axis
  #   collective thrust c: [0,1] → [0, 1.6 * m * g]

network:
  hidden_dim: 256
  num_layers: 3
  activation: elu
  use_layer_norm: true

reward:
  lambda_smooth: 0.4
  # r_total = r_task + 0.4 * r_smooth
  # r_task   = exp(-||pos - ref||²)    ∈ [0, 1]
  # r_smooth = exp(-||u_t - u_{t-1}||²) ∈ [0, 1]

ppo:
  gamma: 0.99
  gae_lambda: 0.95
  clip_eps: 0.2
  actor_lr: 3.0e-4
  critic_lr: 1.0e-4        # SEPARATE optimizer, LOWER than actor — critical
  critic_updates: 16       # critic gradient steps per PPO actor update
  entropy_coeff: 1.0e-3    # must be << reward magnitude
  max_grad_norm: 0.5
  value_loss_coeff: 0.5
  num_minibatches: 8
  ppo_epochs: 5
  horizon: 32              # rollout steps per env before update
  minibatch_size: 256      # kept for reference; actual = T*N/num_minibatches

training:
  trajectory_mix:
    smooth_polynomial: 0.5    # 50% smooth polynomial
    infeasible_zigzag: 0.5    # 50% infeasible zigzag
    # Figure-eight and pentagram are HELD OUT (OOD test)

  sanity_check:
    # Run before first training step. Stop if entropy > 10% of reward.
    entropy_ratio_threshold: 0.10

eval:
  trajectories:
    - figure_eight_slow
    - figure_eight_normal
    - figure_eight_fast
    - pentagram_slow
    - pentagram_fast
    - random_polynomial
    - random_zigzag
  metric: med_xy
  m1_target_med:
    figure_eight_normal: 0.056   # 2× paper's 0.028
    figure_eight_slow: 0.040
    figure_eight_fast: 0.100
    pentagram_slow: 0.060
    pentagram_fast: 0.120
    random_polynomial: 0.060
    random_zigzag: 0.100
